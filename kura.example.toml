# distill-kura — one file describes every kura this machine serves.
#
# Copy to `kura.toml` (or point at it with $KURA_CONFIG / `kura -c`).
# With no config at all, $KURA_DIR (default ./memory) becomes a single store
# named `main`, so you can try the tool before you configure anything.

[server]
host = "127.0.0.1"     # no auth: keep it on loopback unless you add one in front
port = 8085
default = "main"       # which kura answers when a request names none
# Launch with KURA_BUILD_ID=<commit> and GET /health echoes it (plus pid, start time,
# and the code path actually imported) — the deploy postcondition. A restart command
# is not evidence the new build is serving; docs/OPERATING.md "Deploying means proving it".


# ── models ──────────────────────────────────────────────────────────────────
# Three ROLES, not three machines:
#   thinker — picks index lines by meaning at recall time. Runs on every recall,
#             so it wants to be small and fast. Quality bar: can it tell that
#             "SSD inference chips" and "run the model from an SSD tier" are the
#             same subject? A 4B-class local model usually can.
#   brain   — the distiller's reader. Swallows a whole batch of journal and names
#             what deserves to be remembered. Wants context length and patience.
#   scribe  — the distiller's writer. Composes the memory in your language and
#             later re-reads drafts to pour/fix/toss them. Wants judgement and
#             good prose in the target language.
#
# DEFAULT: declare only [models.thinker] and one model does all three jobs — the model
# you talk to is also the EDITOR that writes and judges your memories in its idle minutes.
# UPGRADE: give brain and/or scribe their own endpoint — a bigger local model, or
# an online API. Any OpenAI-compatible /chat/completions works; the key is read
# from the named environment variable and never stored in this file.

[models.thinker]
url = "http://127.0.0.1:8000/v1"
model = "local-model"
effort = "low"          # low | medium | high
# dialect = "vllm"      # vllm (default: sends chat_template_kwargs) | openai | generic
#   A strict OpenAI service 400s on unknown top-level fields; the client retries once
#   with a minimal body, and records why in `last_error`.
# api_key_env = "LOCAL_LLM_KEY"   # some local servers demand a key even unauthenticated

# ── upgrade examples (delete what you do not use) ───────────────────────────
# A stronger local model for the reading work:
# [models.brain]
# url = "http://127.0.0.1:8011/v1"
# model = "big-local"
# effort = "medium"       # `low` makes some models go quiet on list-making work
#
# An online API for the writing work. It must answer POST <url>/chat/completions in the
# OpenAI shape — which is NOT the same as "any provider": a vendor's native API needs an
# OpenAI-compatible gateway in front of it, and its own URL will not do.
# [models.scribe]
# url = "https://your-openai-compatible-gateway.example/v1"
# model = "some-strong-model"
# api_key_env = "MY_API_KEY"        # read from the environment, never stored here
# dialect = "openai"                # omit chat_template_kwargs on a strict service
# temperature = 0.4
#
# A slow, deep local model as the EDITOR on its own seat (the setup the design came
# from: a huge CPU-only model writes and judges, a fast GPU model reads; maintenance
# then goes on while you talk — pair it with yield_on_return = false under [distill]):
# [models.scribe]
# url = "http://127.0.0.1:8096/v1"
# model = "big-cpu-model"
# effort = "low"          # deep models can spend the whole budget thinking


# ── the kura ────────────────────────────────────────────────────────────────
# One directory each. They do not share memories, an index, or a distiller
# watermark — switching mode really does change what is remembered.

[stores.main]
path = "~/kura/main"
label = "main memory"
# write_policy = "distiller-only"   # direct-allowed | distiller-only | frozen
#   direct-allowed  a tool call or the CLI may write (the default)
#   distiller-only  only a draft that passed the evidence gate. Recommended for any
#                   store an agent reads from constantly
#   frozen          nothing may write. For an archive you keep but do not grow
# model_profile = "private"         # bind this store's own endpoints (see below)
# persona = "~/kura/main/persona.json"   # pointer only: rendering personas is the host's job

[stores.maker]
path = "~/kura/maker"
label = "maker mode — building things"

[stores.eq]
path = "~/kura/eq"
label = "EQ mode — talking things through"


# ── modes ───────────────────────────────────────────────────────────────────
# An agent mode (a DSH preset name, a Claude Code profile, whatever your host
# calls it) → the kura it speaks from. A request may name either side.
#
# The mode is chosen BEFORE a conversation, by the host, and is that session's home:
# nothing here reads a message and picks a store, and a memory never moves between
# stores afterwards. An unknown mode is an error, never a fall to `default`.
# For a layout with more than two rooms see examples/rooms/kura.rooms.example.toml —
# kept separate so this minimal file stays minimal.

[modes]
default = "main"
maker = "maker"
eq = "eq"


# ── model profiles ──────────────────────────────────────────────────────────
# One shared [models] set means one endpoint sees EVERY store's index, journal and
# draft — so separating stores on disk buys nothing against the model. A store naming a
# profile gets that profile and nothing else. An undefined profile is a load error,
# never a quiet fall back to the shared endpoint.
#
# [model_profiles.private.thinker]
# url = "http://127.0.0.1:8100/v1"
# model = "private-thinker"


# ── the resident map ────────────────────────────────────────────────────────
# The index as a standing block in the system prompt, so the agent always knows what is
# known — and, more importantly, what is not. `kura weave` builds it; `kura prefill`
# prints it; the DSH plugin injects it.

[prefill]
window_tokens = 131072      # the agent's context window. DECLARE it — a wrong guess overflows
budget_fraction = 0.05      # soft target: the index should cost about this much of the window
hard_fraction = 0.20        # over this, the map is replaced by a stub. Never truncated
fresh_days = 14             # memories this recent keep their full line ("still vivid")
pinned_types = ["feedback", "user"]   # these types always keep their full line
trigger_tokens = 24         # budget for one compressed line, in tokens, not characters
# verbatim_after = "## Appendix"      # copy everything from this heading on, untouched
# cloth_path = "…/_still/index.woven.md"   # where the woven cloth is written.
#   Must be under the store's _still/ or entirely outside the store: pointing it at a
#   store-root .md destroys that memory, one weave at a time. A frozen store refuses a
#   cloth inside it at all — put it outside to keep a resident map for an archive.
# header = "…"              # your own preamble. It may not contain anything that ticks

# Per-store overrides work here too:
# [stores.eq.prefill]
# fresh_days = 30

# ── the fast path ───────────────────────────────────────────────────────────
# Tier zero of recall: a deterministic five-head recognizer over the index. A DIRECT
# question — one that names a memory by slug, title or its own rare words — is answered
# in well under a millisecond and the thinker is not called at all (so a direct question
# still finds its memory when the thinker is down). Anything less than a strong, clear
# winner falls through to the thinker unchanged: silence is the honest answer for a
# paraphrase, and judging by meaning stays the model's job.

[fastpath]
enabled = true
gate = 1.0            # honesty bar for the top hit; raise it to make tier zero shyer

# Per-store overrides work here too:
# [stores.eq.fastpath]
# enabled = false

# ── pay it forward ──────────────────────────────────────────────────────────
# Bake the resident map into a slow mouth's KV cache in the quiet hours, so the first
# turn after a re-weave — or a mouth restart — is warm. The mouth is a llama.cpp
# server started with --slot-save-path. Minutes of cold prefill become a sub-second
# restore; the measurements and the --slot-save-path requirement are in
# docs/OPERATING.md § Paying the map forward. `kura pay-forward` runs it; `kura tend`
# runs it after each weave.
#
# [[payforward.mouths]]
# name = "cpu-mouth"
# url = "http://127.0.0.1:8014"   # server BASE: the slots API lives beside /v1, not under it
# store = "main"                  # whose map this mouth wears
# slot = 0                        # the llama.cpp slot saved from / restored into
# model = "local"                 # alias for the one-token probe call
# api_key_env = "MOUTH_KEY"       # read from the environment, never stored here

# ── the distiller ───────────────────────────────────────────────────────────
# Where the raw material comes from. Keys are source adapters:
#   claude = a directory of Claude Code .jsonl transcripts
#   dsh    = a DSH sessions directory (session.jsonl.zstd; needs the `zstd` binary)
#   text   = a directory of .md/.txt/.log notes

[distill]
language = "English"        # the language memories are WRITTEN in
scribe_slots = 4            # concurrent compositions (match your server's slots)
chunk_chars = 200_000       # one batch; aim at what the brain swallows in one gulp

# The watcher (`kura tend`). Quiet = the newest journal file's mtime.
idle_min = 10               # minutes of silence before a track may run
backoff_min = 20            # rest after a track had nothing to do (exit 2)
yield_on_return = true      # stop a running track when the journal changes. Set false
                            # when the editor sits on its own seat (a CPU model, another
                            # machine) and does not compete with the conversation

# A root may also be a table, because one sessions directory usually holds every mode's
# conversations and you rarely want all of them in one kura:
#   dsh = { root = "~/dsh/sessions", exclude_glob = ["**/scratch/**"] }

[distill.journals]
claude = "~/.claude/projects/my-project"
# evidence = "~/journals"   # classified .evidence.jsonl (USER/SELF/ACT/TOOL)
# dsh  = "~/dsh/sessions"
# text = "~/notes"

# ⚠️ With MORE THAN ONE store configured, a store inherits nothing from [distill.journals]
# unless you say so — feeding two kura from one root distils each mode's conversations
# into both. Bind each store to its own root instead:
# [stores.eq.distill]
# language = "日本語"
# inherit_global_journals = false      # explicit is better; this is the default above 1 store
# [stores.eq.distill.journals]
# text = "~/notes/dialogue"

# A journal root that CONTAINS a store is refused at load: the distiller would re-ingest
# memories as raw material and file model-written text as the human's words. Override
# only if you know exactly why: [server] allow_path_overlap = true
